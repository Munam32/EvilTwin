[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinwatch"
version = "0.1.0"
description = "Passive evil twin Wi-Fi access point detector for Linux"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "scikit-learn>=1.4", "pandas>=2.0", "matplotlib>=3.8"]
monitor = ["scapy>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
twinwatch = "cli:main"

[tool.setuptools]
py-modules = ["cli", "cluster", "features", "model", "recording", "report", "store"]
packages = ["scan", "detectors", "datasets", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
