[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinwatch"
version = "0.1.0"
description = "Passive evil twin Wi-Fi access point detector for Linux"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
eval = ["pandas>=2.0", "matplotlib>=3.8"]
monitor = ["scapy>=2.5"]
dev = ["pytest>=8", "dvc>=3"]

[project.scripts]
twinwatch = "twinwatch.cli:main"

[tool.setuptools.packages.find]
include = ["twinwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
